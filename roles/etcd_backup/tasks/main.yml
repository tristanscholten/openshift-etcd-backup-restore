---
- name: Refuse unsafe backup installation
  ansible.builtin.assert:
    that:
      - backup_install_confirm | bool
      - backup_source_hostname | length > 0
      - inventory_hostname == backup_source_hostname
      - backup_root is match('^' ~ (backup_user_home | regex_escape) ~ '/[^.][A-Za-z0-9._/-]*$')
      - "'..' not in backup_root.split('/')"
    fail_msg: >-
      Installation is limited to the nominated source under its configured home and
      requires -e backup_install_confirm=true.

- name: Require installed vendor backup script
  ansible.builtin.stat:
    path: "{{ backup_vendor_script }}"
  register: vendor_backup_script

- name: Fail if vendor backup script is absent
  ansible.builtin.assert:
    that:
      - vendor_backup_script.stat.exists
      - vendor_backup_script.stat.isreg
      - vendor_backup_script.stat.executable

- name: Create managed backup directory
  ansible.builtin.file:
    path: "{{ backup_root }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install fail-closed backup runner
  ansible.builtin.copy:
    src: ocp-etcd-backup-runner
    dest: /usr/local/sbin/ocp-etcd-backup-runner
    owner: root
    group: root
    mode: '0700'

- name: Install read-only backup validator
  ansible.builtin.copy:
    src: validate_backup.py
    dest: /usr/local/libexec/ocp-etcd-validate-backup
    owner: root
    group: root
    mode: '0700'

- name: Install backup service unit
  ansible.builtin.template:
    src: ocp-etcd-backup.service.j2
    dest: "/etc/systemd/system/{{ backup_service_name }}.service"
    owner: root
    group: root
    mode: '0644'

- name: Install backup timer unit
  ansible.builtin.template:
    src: ocp-etcd-backup.timer.j2
    dest: "/etc/systemd/system/{{ backup_service_name }}.timer"
    owner: root
    group: root
    mode: '0644'

- name: Enable nominated source timer
  ansible.builtin.systemd_service:
    name: "{{ backup_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
