---
- name: Delete one exact mapped non-recovery Machine
  block:
    - name: Delete exact reconciled Machine with UID precondition
      ansible.builtin.command:
        argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', delete, '-f', '{{ restore_controller_state_dir }}/{{ restore_selection }}/reconciled/{{ ha_peer.inventory_hostname }}.machine.json']
      changed_when: true
      delegate_to: localhost
      become: false

    - name: Wait for documented cluster stability before next Machine
      ansible.builtin.command:
        argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', adm, wait-for-stable-cluster, '--minimum-stable-period=5m']
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Record recovered peer checkpoint
      ansible.builtin.copy:
        content: '{"phase":"HA_MACHINE_RECOVERY","set_id":"{{ restore_selection }}","recovered_peer":"{{ ha_peer.inventory_hostname }}","next_safe_action":"continue only after each stability gate"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
  rescue:
    - name: Persist peer recovery failure checkpoint
      ansible.builtin.copy:
        content: '{"phase":"HA_MACHINE_RECOVERY_INCOMPLETE","set_id":"{{ restore_selection }}","failed_peer":"{{ ha_peer.inventory_hostname }}","next_safe_action":"do not rerun; assess failed Machine recovery"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
    - name: Stop after peer recovery failure
      ansible.builtin.fail:
        msg: 'HA_MACHINE_RECOVERY_INCOMPLETE: {{ ha_peer.inventory_hostname }} did not complete documented stability gate; inspect checkpoint.'
