---
- name: Read-only CronJob vendor backup discovery
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    backup_root: /home/core/etcd-backups
    backup_source_hostname: ''
  pre_tasks:
    - name: Require one nominated source for discovery
      ansible.builtin.assert:
        that:
          - backup_source_hostname in groups['control_plane']
        fail_msg: 'backup_source_hostname must name an inventory control-plane host.'
      run_once: true
  tasks:
    - name: Discover only complete CronJob vendor pairs without reading archive content
      ansible.builtin.script:
        cmd: '{{ playbook_dir }}/../scripts/discover_vendor_backup.py {{ backup_root }}'
      delegate_to: '{{ backup_source_hostname }}'
      changed_when: false
      run_once: true
      register: backup_candidates
    - name: Print validated backup metadata only
      ansible.builtin.debug:
        msg: '{{ backup_candidates.stdout | from_json }}'
      run_once: true
