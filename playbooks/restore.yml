---
# OCP 4.20 vendor snapshot recovery. CPMS recovery is deliberately refused:
# its documented degraded-member repair has different healthy-quorum prerequisites.
- name: Restore an OCP etcd snapshot from a CronJob vendor pair
  hosts: control_plane
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    backup_root: /home/core/etcd-backups
    backup_source_hostname: ''
    recovery_host: ''
    restore_topology: ''
    restore_selection: ''
    expected_cluster_id: ''
    expected_ocp_version: ''
    destructive_confirm: ''
    restore_mode: apply
    restore_host_identity_path: /sys/class/dmi/id/product_uuid
    restore_machine_config_path: /etc/machine-config-daemon/currentconfig
    restore_vendor_restore_script: /usr/local/bin/cluster-restore.sh
    restore_vendor_disable_script: /usr/local/bin/disable-etcd.sh
    restore_oc_path: ''
    post_api_kubeconfig: ''
    restore_controller_state_dir: "{{ lookup('env', 'HOME') }}/.local/state/ocp-etcd-restore"
    restore_stage_dir: /home/core/etcd-restore
    restore_stage_owner: core
    restore_stage_group: core
    restore_api_retries: 60
    restore_api_delay: 10
  pre_tasks:
    - name: Refuse unsupported topology before discovery
      ansible.builtin.assert:
        that:
          - groups['control_plane'] | length in [1, 3]
          - backup_source_hostname in groups['control_plane']
          - recovery_host in groups['control_plane']
          - (groups['control_plane'] | length == 1 and restore_topology == 'sno') or (groups['control_plane'] | length == 3 and restore_topology == 'ha')
          - restore_host_identity_path is match('^/\S+$')
          - restore_machine_config_path is match('^/\S+$')
          - expected_cluster_id is match('^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$')
          - expected_ocp_version is match('^4\.20\.[0-9]+$')
        fail_msg: 'Supported recovery is OCP 4.20 SNO or three-host non-CPMS HA with explicit cluster/release identity; no mutation occurred.'
      run_once: true
    - name: Require installed vendor recovery command
      ansible.builtin.stat:
        path: '{{ restore_vendor_restore_script }}'
      register: restore_vendor_restore_path
    - name: Require installed HA fencing command
      ansible.builtin.stat:
        path: '{{ restore_vendor_disable_script }}'
      register: restore_vendor_disable_path
      when: restore_topology == 'ha'
    - name: Fail if required vendor commands are absent
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.isreg and not item.stat.islnk and item.stat.executable
        fail_msg: 'Installed OpenShift recovery command missing; no mutation occurred.'
      loop: "{{ [restore_vendor_restore_path] + ([restore_vendor_disable_path] if restore_topology == 'ha' else []) }}"
  tasks:
    - name: Discover complete CronJob vendor backup pairs without API access
      ansible.builtin.script:
        cmd: '{{ playbook_dir }}/../scripts/discover_vendor_backup.py {{ backup_root }}'
      delegate_to: '{{ backup_source_hostname }}'
      changed_when: false
      run_once: true
      register: restore_candidates
    - name: Display selectable complete backup pairs
      ansible.builtin.debug:
        msg: '{{ restore_candidates.stdout | from_json }}'
      run_once: true
    - name: Obtain one selected timestamp when not supplied
      ansible.builtin.pause:
        prompt: 'Enter one displayed backup timestamp (YYYYMMDDTHHMMSSZ)'
      register: restore_selection_prompt
      when: restore_selection | length == 0
      run_once: true
    - name: Set selected timestamp
      ansible.builtin.set_fact:
        restore_selected_timestamp: '{{ restore_selection if restore_selection | length > 0 else restore_selection_prompt.user_input }}'
      run_once: true
    - name: Validate selected pair and healthy-backup manifest
      ansible.builtin.script:
        cmd: '{{ playbook_dir }}/../scripts/discover_vendor_backup.py {{ backup_root }} {{ restore_selected_timestamp }}'
      delegate_to: '{{ backup_source_hostname }}'
      changed_when: false
      run_once: true
      register: restore_selected_manifest
    - name: Require exact source release, topology, and cluster identity
      ansible.builtin.assert:
        that:
          - (restore_selected_manifest.stdout | from_json).cluster_id == expected_cluster_id
          - (restore_selected_manifest.stdout | from_json).ocp_version == expected_ocp_version
          - (restore_selected_manifest.stdout | from_json).topology == restore_topology
          - (restore_selected_manifest.stdout | from_json).cpms_enabled == false
          - ((restore_selected_manifest.stdout | from_json).control_plane | map(attribute='node_name') | sort | list) == (groups['control_plane'] | sort)
        fail_msg: 'Selected pair does not bind this exact non-CPMS control-plane inventory, topology, cluster identity, and OCP 4.20 z-stream; no mutation occurred.'
      run_once: true
    - name: Verify every SSH target identity and installed release configuration offline
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../scripts/validate_restore_host.py
          --manifest-base64 '{{ restore_selected_manifest.stdout | trim | b64encode }}'
          --inventory-host '{{ inventory_hostname }}'
          --identity-path '{{ restore_host_identity_path }}'
          --machine-config-path '{{ restore_machine_config_path }}'
      changed_when: false
    - name: End read-only discovery and preflight
      ansible.builtin.meta: end_play
      when: restore_mode == 'preflight' or ansible_check_mode
    - name: Obtain one destructive confirmation when not supplied
      ansible.builtin.pause:
        prompt: 'Type RESTORE_<cluster-id> to destructively restore the selected snapshot'
      register: destructive_confirm_prompt
      when: destructive_confirm | length == 0
      run_once: true
    - name: Require exact confirmation and post-API inputs
      ansible.builtin.assert:
        that:
          - (destructive_confirm if destructive_confirm | length > 0 else destructive_confirm_prompt.user_input) == 'RESTORE_' ~ expected_cluster_id
          - post_api_kubeconfig | length > 0
          - restore_oc_path is match('^/\S+$')
        fail_msg: 'Exact confirmation, certificate kubeconfig, and absolute local oc are required; no mutation occurred.'
      run_once: true
    - name: Inspect controller certificate kubeconfig
      ansible.builtin.stat:
        path: '{{ post_api_kubeconfig }}'
      delegate_to: localhost
      become: false
      run_once: true
      register: restore_kubeconfig_stat
    - name: Inspect controller oc
      ansible.builtin.stat:
        path: '{{ restore_oc_path }}'
      delegate_to: localhost
      become: false
      run_once: true
      register: restore_oc_stat
    - name: Require readable certificate kubeconfig and executable local oc
      ansible.builtin.assert:
        that:
          - restore_kubeconfig_stat.stat.exists and restore_kubeconfig_stat.stat.isreg and not restore_kubeconfig_stat.stat.islnk and restore_kubeconfig_stat.stat.readable
          - restore_oc_stat.stat.exists and restore_oc_stat.stat.isreg and not restore_oc_stat.stat.islnk and restore_oc_stat.stat.executable
        fail_msg: 'Apply requires an existing readable regular certificate kubeconfig and executable absolute restore_oc_path; no mutation occurred.'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Create controller checkpoint directory
      ansible.builtin.file:
        path: '{{ restore_controller_state_dir }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Refuse an interrupted or completed restore rerun
      ansible.builtin.stat:
        path: '{{ restore_controller_state_dir }}/{{ restore_selected_timestamp }}.json'
      delegate_to: localhost
      become: false
      run_once: true
      register: restore_checkpoint
    - name: Require no existing restore checkpoint
      ansible.builtin.assert:
        that: not restore_checkpoint.stat.exists
        fail_msg: 'RESTORE_RERUN_REFUSED: selected backup has an existing recovery checkpoint.'
      run_once: true
    - name: Fetch exactly the selected matching pair from one source
      ansible.builtin.fetch:
        src: '{{ backup_root }}/{{ item }}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selected_timestamp }}/'
        flat: true
      loop:
        - 'snapshot_{{ restore_selected_timestamp }}.db'
        - 'static_kuberesources_{{ restore_selected_timestamp }}.tar.gz'
        - '.ocp-etcd-cronjob-managed-{{ restore_selected_timestamp }}.json'
      delegate_to: '{{ backup_source_hostname }}'
      run_once: true
    - name: Verify fetched pair integrity before host mutation
      ansible.builtin.command:
        argv: ['/usr/bin/python3', '{{ playbook_dir }}/../scripts/discover_vendor_backup.py', '{{ restore_controller_state_dir }}/{{ restore_selected_timestamp }}', '{{ restore_selected_timestamp }}']
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true
    - name: Record restore in progress
      ansible.builtin.copy:
        content: '{"phase":"IN_PROGRESS","timestamp":"{{ restore_selected_timestamp }}"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selected_timestamp }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Run documented SSH recovery and post-API health checks
      block:
        - name: Create restore directory on recovery host
          ansible.builtin.file:
            path: '{{ restore_stage_dir }}/{{ restore_selected_timestamp }}'
            state: directory
            owner: '{{ restore_stage_owner }}'
            group: '{{ restore_stage_group }}'
            mode: '0700'
          when: inventory_hostname == recovery_host
        - name: Copy same matching pair to recovery host
          ansible.builtin.copy:
            src: '{{ restore_controller_state_dir }}/{{ restore_selected_timestamp }}/{{ item }}'
            dest: '{{ restore_stage_dir }}/{{ restore_selected_timestamp }}/{{ item }}'
            owner: '{{ restore_stage_owner }}'
            group: '{{ restore_stage_group }}'
            mode: '0600'
          loop:
            - 'snapshot_{{ restore_selected_timestamp }}.db'
            - 'static_kuberesources_{{ restore_selected_timestamp }}.tar.gz'
            - '.ocp-etcd-cronjob-managed-{{ restore_selected_timestamp }}.json'
          when: inventory_hostname == recovery_host
        - name: Verify copied pair integrity on recovery host
          ansible.builtin.script:
            cmd: '{{ playbook_dir }}/../scripts/discover_vendor_backup.py {{ restore_stage_dir }}/{{ restore_selected_timestamp }} {{ restore_selected_timestamp }}'
          changed_when: false
          when: inventory_hostname == recovery_host
        - name: Disable etcd on every HA control-plane host
          ansible.builtin.command:
            argv: ['{{ restore_vendor_disable_script }}']
          changed_when: true
          when: restore_topology == 'ha'
        - name: Restore exactly once on recovery host before any API operation
          ansible.builtin.command:
            argv: ['{{ restore_vendor_restore_script }}', '{{ restore_stage_dir }}/{{ restore_selected_timestamp }}']
          changed_when: true
          when: inventory_hostname == recovery_host
        - name: Wait for API readiness only after SSH vendor recovery
          ansible.builtin.command:
            argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', 'get', '--raw=/readyz']
          changed_when: false
          register: restore_api
          retries: '{{ restore_api_retries | int }}'
          delay: '{{ restore_api_delay | int }}'
          until: restore_api.rc == 0
          delegate_to: localhost
          become: false
          run_once: true
        - name: Enable temporary etcd quorum guard override
          ansible.builtin.command:
            argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', patch, etcd, cluster, --type=merge, '--patch={"spec":{"unsupportedConfigOverrides":{"useUnsupportedUnsafeNonHANonProductionUnstableEtcd":true}}}']
          changed_when: true
          delegate_to: localhost
          become: false
          run_once: true
          when: restore_topology == 'ha'
        - name: Wait for stable recovered cluster
          ansible.builtin.command:
            argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', adm, wait-for-stable-cluster]
          changed_when: false
          delegate_to: localhost
          become: false
          run_once: true
        - name: Clear temporary etcd quorum guard after successful HA stability
          ansible.builtin.command:
            argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', patch, etcd, cluster, --type=merge, '--patch={"spec":{"unsupportedConfigOverrides":null}}']
          changed_when: true
          delegate_to: localhost
          become: false
          run_once: true
          when: restore_topology == 'ha'
      rescue:
        - name: Record failed recovery checkpoint
          ansible.builtin.copy:
            content: '{"phase":"FAILED","timestamp":"{{ restore_selected_timestamp }}"}'
            dest: '{{ restore_controller_state_dir }}/{{ restore_selected_timestamp }}.json'
            mode: '0600'
          delegate_to: localhost
          become: false
          run_once: true
        - name: Stop after failed recovery
          ansible.builtin.fail:
            msg: 'RESTORE_FAILED: inspect the durable checkpoint before any manual recovery action.'
          run_once: true
    - name: Write verified checkpoint
      ansible.builtin.copy:
        content: '{"phase":"VERIFIED","timestamp":"{{ restore_selected_timestamp }}"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selected_timestamp }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
