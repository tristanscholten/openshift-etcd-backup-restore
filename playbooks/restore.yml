---
# Supported vendor path: 4.20 SNO and three-host HA only. Initial phases never call oc.
- name: Guarded OCP etcd restore
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    restore_mode: preflight
    restore_selection: ''
    expected_cluster_id: ''
    destructive_confirm: ''
    backup_root: /home/core/etcd-backups
    recovery_host: ''
    restore_topology: ''
    restore_state_dir: /var/lib/ocp-etcd-restore
  pre_tasks:
    - name: Validate immutable selection and supported topology
      ansible.builtin.assert:
        that:
          - restore_mode in ['preflight', 'apply']
          - restore_selection is match('^set-[0-9]{8}T[0-9]{6}Z$')
          - expected_cluster_id | length > 0
          - recovery_host in groups['control_plane']
          - groups['control_plane'] | length in [1, 3]
          - (groups['control_plane'] | length == 1 and restore_topology == 'sno') or (groups['control_plane'] | length == 3 and restore_topology == 'ha')
        fail_msg: Unsupported topology, selection, or recovery host; no mutation occurred.
    - name: Require confirmation before any apply mutation
      ansible.builtin.assert:
        that: destructive_confirm == 'RESTORE_' ~ expected_cluster_id
        fail_msg: Exact destructive confirmation required.
      when: restore_mode == 'apply'
    - name: Inspect vendor scripts and selected metadata read-only
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/ocp-etcd-validate-backup
          - '{{ backup_root }}'
          - '{{ restore_selection }}'
      changed_when: false
      check_mode: false
      register: backup_metadata
      failed_when: backup_metadata.rc != 0
    - name: Require exact selected version and cluster identity
      ansible.builtin.assert:
        that:
          - (backup_metadata.stdout | from_json).cluster_id == expected_cluster_id
          - (backup_metadata.stdout | from_json).ocp_version is match('^4\.20\.[0-9]+$')
      changed_when: false
  tasks:
    - name: Stop after non-mutating preflight
      ansible.builtin.meta: end_play
      when: restore_mode == 'preflight' or ansible_check_mode
    - name: Disable backup timer before recovery copy
      ansible.builtin.systemd_service:
        name: ocp-etcd-backup.timer
        enabled: false
        state: stopped
      failed_when: false
    - name: Create immutable recovery workspace on recovery host
      ansible.builtin.file:
        path: '{{ restore_state_dir }}/{{ restore_selection }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: inventory_hostname == recovery_host
    - name: Copy selected immutable pair to recovery host
      ansible.builtin.copy:
        src: '{{ backup_root }}/{{ restore_selection }}/'
        dest: '{{ restore_state_dir }}/{{ restore_selection }}/'
        remote_src: true
        owner: root
        group: root
        mode: preserve
      when: inventory_hostname == recovery_host
    - name: Fence every HA control plane with vendor script
      ansible.builtin.command:
        argv: [/usr/local/bin/disable-etcd.sh]
      when: restore_topology == 'ha'
    - name: Verify etcd containers are absent after fencing
      ansible.builtin.command:
        argv: [/usr/bin/crictl, ps, --name, etcd]
      register: crictl_etcd
      changed_when: false
      failed_when: crictl_etcd.rc not in [0, 1]
      when: restore_topology == 'ha'
    - name: Invoke vendor restore exactly once on recovery host
      ansible.builtin.command:
        argv: [/usr/local/bin/cluster-restore.sh, '{{ restore_state_dir }}/{{ restore_selection }}']
      when: inventory_hostname == recovery_host
