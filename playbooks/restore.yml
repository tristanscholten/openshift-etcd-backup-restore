---
- name: Guarded OCP etcd restore
  hosts: control_plane
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    restore_mode: preflight
    restore_selection: ''
    expected_cluster_id: ''
    destructive_confirm: ''
    backup_user_home: /home/core
    backup_root: '{{ backup_user_home }}/etcd-backups'
    backup_source_hostname: ''
    recovery_host: ''
    restore_topology: ''
    restore_state_dir: /var/lib/ocp-etcd-restore
    restore_controller_state_dir: "{{ lookup('env', 'HOME') }}/.local/state/ocp-etcd-restore"
    post_api_kubeconfig: ''
    ha_machine_map: {}
    ocp_version_command: /usr/bin/rpm -q --qf %{VERSION} openshift-clients
    restore_validator_path: /usr/local/libexec/ocp-etcd-validate-backup
    restore_vendor_restore_script: /usr/local/bin/cluster-restore.sh
    restore_vendor_disable_script: /usr/local/bin/disable-etcd.sh
    restore_crictl_path: /usr/bin/crictl
    restore_oc_path: oc
    restore_min_free_kb: 1048576
    restore_min_certificate_age_seconds: 86400
    restore_lock_retries: 10
    restore_lock_delay: 2
    restore_fence_retries: 30
    restore_fence_delay: 2
    restore_etcd_cert_path: /etc/kubernetes/static-pod-resources/etcd-certs
    restore_etcd_manifest_path: /etc/kubernetes/manifests/etcd-pod.yaml
    backup_service_name: ocp-etcd-backup
    restore_fixture_action_path: ''
  pre_tasks:
    - name: Validate topology and explicit HA mapping before mutation
      ansible.builtin.assert:
        that:
          - restore_mode in ['preflight', 'apply']
          - restore_selection is match('^set-[0-9]{8}T[0-9]{6}Z$')
          - expected_cluster_id | length > 0
          - backup_source_hostname in groups['control_plane']
          - recovery_host in groups['control_plane']
          - groups['control_plane'] | length in [1, 3]
          - (groups['control_plane'] | length == 1 and restore_topology == 'sno') or (groups['control_plane'] | length == 3 and restore_topology == 'ha')
          - restore_topology != 'ha' or post_api_kubeconfig | length > 0
          - restore_topology != 'ha' or ha_machine_map | type_debug == 'dict'
          - restore_topology != 'ha' or (ha_machine_map.keys() | list | sort == (groups['control_plane'] | difference([recovery_host]) | sort))
          - restore_topology != 'ha' or (ha_machine_map.values() | select('string') | map('trim') | reject('equalto', '') | list | length == 2)
        fail_msg: 'Unsupported topology, exact non-recovery Machine mapping, selection, or recovery host; no mutation occurred.'
      run_once: true
    - name: Require confirmation before apply mutation
      ansible.builtin.assert:
        that: destructive_confirm == 'RESTORE_' ~ expected_cluster_id
        fail_msg: 'Exact destructive confirmation required.'
      when: restore_mode == 'apply'
      run_once: true
    - name: Inspect controller kubeconfig before mutation
      ansible.builtin.stat:
        path: '{{ post_api_kubeconfig }}'
      delegate_to: localhost
      become: false
      run_once: true
      register: restore_kubeconfig_stat
      when: restore_mode == 'apply'
    - name: Require readable regular controller kubeconfig before mutation
      ansible.builtin.assert:
        that:
          - restore_kubeconfig_stat.stat.exists
          - restore_kubeconfig_stat.stat.isreg
          - not restore_kubeconfig_stat.stat.islnk
          - restore_kubeconfig_stat.stat.readable
        fail_msg: 'Apply requires an existing readable regular certificate kubeconfig on the controller; no mutation occurred.'
      delegate_to: localhost
      become: false
      run_once: true
      when: restore_mode == 'apply'
    - name: Inspect controller oc client before mutation
      ansible.builtin.stat:
        path: '{{ restore_oc_path }}'
      delegate_to: localhost
      become: false
      run_once: true
      register: restore_oc_stat
      when: restore_mode == 'apply' and restore_oc_path.startswith('/')
    - name: Require executable controller oc client before mutation
      ansible.builtin.assert:
        that:
          - restore_oc_path.startswith('/')
          - restore_oc_stat.stat.exists
          - restore_oc_stat.stat.isreg
          - not restore_oc_stat.stat.islnk
          - restore_oc_stat.stat.executable
        fail_msg: 'Apply requires an existing executable absolute restore_oc_path on the controller; no mutation occurred.'
      delegate_to: localhost
      become: false
      run_once: true
      when: restore_mode == 'apply'
    - name: Detect each installed version without API access
      ansible.builtin.command:
        cmd: '{{ ocp_version_command }}'
      changed_when: false
      check_mode: false
      register: restore_installed_version
    - name: Require equal supported installed versions
      ansible.builtin.assert:
        that:
          - restore_installed_version.stdout | trim is match('^4\.20\.[0-9]+$')
          - restore_installed_version.stdout | trim == hostvars[groups['control_plane'][0]].restore_installed_version.stdout | trim
        fail_msg: 'Installed versions must be equal OCP 4.20.z on every control-plane host.'
    - name: Validate source set once
      ansible.builtin.command:
        argv: ['{{ restore_validator_path }}', '{{ backup_root }}', '{{ restore_selection }}']
      changed_when: false
      check_mode: false
      register: restore_source_metadata
      delegate_to: '{{ backup_source_hostname }}'
      run_once: true
    - name: Require selected z-stream and cluster identity
      ansible.builtin.assert:
        that:
          - (restore_source_metadata.stdout | from_json).cluster_id == expected_cluster_id
          - (restore_source_metadata.stdout | from_json).ocp_version == hostvars[groups['control_plane'][0]].restore_installed_version.stdout | trim
        fail_msg: 'Selected set does not match cluster identity and installed exact z-stream.'
      run_once: true
    - name: Require vendor, runtime, and static-pod prerequisites on every host
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ restore_vendor_restore_script }}'
        - '{{ restore_vendor_disable_script }}'
        - '{{ restore_crictl_path }}'
        - '{{ restore_etcd_manifest_path }}'
        - '{{ restore_etcd_cert_path }}'
      register: restore_vendor_paths
    - name: Assert vendor, runtime, and static-pod prerequisites are safe
      ansible.builtin.assert:
        that: item.stat.exists and not item.stat.islnk and (item.stat.isdir or (item.stat.isreg and item.stat.executable))
        fail_msg: 'Required installed vendor, runtime, certificate, or static-pod prerequisite is unavailable.'
      loop: '{{ restore_vendor_paths.results }}'
    - name: Measure free root filesystem space without mutation
      ansible.builtin.command:
        argv: [/usr/bin/df, -Pk, /]
      changed_when: false
      check_mode: false
      register: restore_root_disk
    - name: Require minimum free root filesystem space
      ansible.builtin.assert:
        that: (restore_root_disk.stdout_lines[-1].split()[3] | int) >= (restore_min_free_kb | int)
        fail_msg: 'Insufficient free root filesystem space for a fail-closed restore.'
    - name: Inspect certificate material age without mutation
      ansible.builtin.stat:
        path: '{{ restore_etcd_cert_path }}'
      register: restore_cert_stat
    - name: Require certificate material older than initial rotation window
      ansible.builtin.assert:
        that: (lookup('pipe', 'date +%s') | int) - (restore_cert_stat.stat.mtime | int) >= (restore_min_certificate_age_seconds | int)
        fail_msg: 'Certificate material is younger than the configured rotation window; no mutation occurred.'
    - name: Require safe absolute managed backup and recovery paths
      ansible.builtin.assert:
        that:
          - backup_user_home is match('^/[^.].*$')
          - backup_root.startswith(backup_user_home ~ '/')
          - restore_state_dir is match('^/var/lib/ocp-etcd-restore(/.*)?$')
          - "'..' not in backup_root"
          - "'..' not in restore_state_dir"
        fail_msg: 'Backup or recovery path is outside its protected managed prefix.'
    - name: Require safe writable controller state path before mutation
      ansible.builtin.assert:
        that:
          - restore_controller_state_dir.startswith(lookup('env', 'HOME') ~ '/')
          - "'..' not in restore_controller_state_dir"
        fail_msg: 'Controller state must be a protected path below the invoking controller user home.'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Detect prior destructive checkpoint
      ansible.builtin.stat:
        path: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
      delegate_to: localhost
      become: false
      run_once: true
      register: restore_prior_state
    - name: Refuse blind destructive rerun
      ansible.builtin.assert:
        that: not restore_prior_state.stat.exists
        fail_msg: 'RESTORE_RERUN_REFUSED: inspect the durable checkpoint; do not rerun fenced or vendor restore.'
      when: restore_mode == 'apply'
      run_once: true
  tasks:
    - name: End read-only preflight and check mode
      ansible.builtin.meta: end_play
      when: restore_mode == 'preflight' or ansible_check_mode
    - name: Create controller checkpoint directory
      ansible.builtin.file:
        path: '{{ restore_controller_state_dir }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Write preflight checkpoint
      ansible.builtin.copy:
        content: '{"phase":"PREFLIGHT_PASSED","set_id":"{{ restore_selection }}","next_safe_action":"copy selected set"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Stop backup timers on all hosts
      ansible.builtin.systemd_service:
        name: ocp-etcd-backup.timer
        enabled: false
        state: stopped
      changed_when: false
      when: restore_fixture_action_path | length == 0
    - name: Record simulated timer stop on all fixture hosts
      ansible.builtin.command:
        argv: ['{{ restore_fixture_action_path }}', timer-stop, '{{ inventory_hostname }}']
      changed_when: true
      when: restore_fixture_action_path | length > 0
    - name: Wait for backup locks on all hosts
      ansible.builtin.command:
        argv: [/usr/bin/flock, -n, /var/lock/ocp-etcd-backup.lock, /usr/bin/true]
      changed_when: false
      register: restore_lock_check
      retries: '{{ restore_lock_retries | int }}'
      delay: '{{ restore_lock_delay | int }}'
      until: restore_lock_check.rc == 0
    - name: Fetch selected set from the single source
      ansible.builtin.fetch:
        src: '{{ backup_root }}/{{ restore_selection }}/{{ item }}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}/'
        flat: true
        validate_checksum: true
      loop:
        - COMPLETE
        - metadata.json
        - SHA256SUMS
        - '{{ (restore_source_metadata.stdout | from_json).snapshot }}'
        - '{{ (restore_source_metadata.stdout | from_json).static_resources }}'
      delegate_to: '{{ backup_source_hostname }}'
      run_once: true
    - name: Create immutable recovery workspace
      ansible.builtin.file:
        path: '{{ restore_state_dir }}/{{ restore_selection }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: inventory_hostname == recovery_host
    - name: Copy source set to recovery host
      ansible.builtin.copy:
        src: '{{ restore_controller_state_dir }}/{{ restore_selection }}/{{ item }}'
        dest: '{{ restore_state_dir }}/{{ restore_selection }}/{{ item }}'
        owner: root
        group: root
        mode: '0600'
      loop:
        - COMPLETE
        - metadata.json
        - SHA256SUMS
        - '{{ (restore_source_metadata.stdout | from_json).snapshot }}'
        - '{{ (restore_source_metadata.stdout | from_json).static_resources }}'
      when: inventory_hostname == recovery_host
    - name: Verify copied source set hash gate
      ansible.builtin.command:
        argv: ['{{ restore_validator_path }}', '{{ restore_state_dir }}', '{{ restore_selection }}']
      changed_when: false
      when: inventory_hostname == recovery_host
    - name: Write immutable-copy checkpoint
      ansible.builtin.copy:
        content: '{"phase":"RECOVERY_COPY_READY","set_id":"{{ restore_selection }}","next_safe_action":"fence all peers"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Fence all HA peers or stop at durable safe checkpoint
      block:
        - name: Fence every HA peer with vendor command
          ansible.builtin.command:
            argv: ['{{ restore_vendor_disable_script }}']
          changed_when: true
          when: restore_topology == 'ha'
        - name: Bounded wait for every HA etcd container to disappear
          ansible.builtin.command:
            argv: ['{{ restore_crictl_path }}', ps, --name, etcd, -q]
          changed_when: false
          register: restore_etcd_fence
          retries: '{{ restore_fence_retries | int }}'
          delay: '{{ restore_fence_delay | int }}'
          until: restore_etcd_fence.rc in [0, 1] and restore_etcd_fence.stdout | trim == ''
          when: restore_topology == 'ha'
      rescue:
        - name: Persist incomplete fencing checkpoint
          ansible.builtin.copy:
            content: '{"phase":"FENCING_INCOMPLETE","set_id":"{{ restore_selection }}","next_safe_action":"inspect fencing failure; do not run vendor restore"}'
            dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
            mode: '0600'
          delegate_to: localhost
          become: false
          run_once: true
        - name: Refuse vendor restore after incomplete fencing
          ansible.builtin.fail:
            msg: 'FENCING_INCOMPLETE: every HA peer must be fenced and have no etcd container before vendor restore.'
          run_once: true
    - name: Write fenced checkpoint
      ansible.builtin.copy:
        content: '{"phase":"FENCED","set_id":"{{ restore_selection }}","next_safe_action":"do not rerun; await vendor restore assessment"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Invoke vendor restore once on recovery host
      ansible.builtin.command:
        argv: ['{{ restore_vendor_restore_script }}', '{{ restore_state_dir }}/{{ restore_selection }}']
      changed_when: true
      when: inventory_hostname == recovery_host
    - name: Write vendor restore checkpoint
      ansible.builtin.copy:
        content: '{"phase":"VENDOR_RESTORE_STARTED","set_id":"{{ restore_selection }}","next_safe_action":"wait for API; do not rerun"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
    - name: Wait for API only after vendor restore
      ansible.builtin.command:
        argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', version]
      changed_when: false
      register: restore_api_ready
      retries: 60
      delay: 10
      until: restore_api_ready.rc == 0
      delegate_to: localhost
      become: false
      run_once: true
    - name: Enable temporary quorum guard after API recovery
      ansible.builtin.command:
        argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', patch, etcd, cluster, --type=merge, '--patch={"spec":{"unsupportedConfigOverrides":{"useUnsupportedUnsafeNonHANonProductionUnstableEtcd":true}}}']
      changed_when: true
      delegate_to: localhost
      become: false
      run_once: true
      when: restore_topology == 'ha'
    - name: Recreate each mapped HA machine and wait before next
      ansible.builtin.include_role:
        name: restore_ha_peer
      loop: '{{ ha_machine_map | dict2items | sort(attribute="key") }}'
      loop_control:
        loop_var: ha_peer
      when: restore_topology == 'ha'
      run_once: true
    - name: Clear temporary quorum guard
      ansible.builtin.command:
        argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', patch, etcd, cluster, --type=json, '--patch=[{"op":"remove","path":"/spec/unsupportedConfigOverrides/useUnsupportedUnsafeNonHANonProductionUnstableEtcd"}]']
      changed_when: true
      delegate_to: localhost
      become: false
      run_once: true
      when: restore_topology == 'ha'
    - name: Require etcd and control-plane operators Available after API recovery
      ansible.builtin.command:
        argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', wait, '--for=condition=Available=True', '--timeout=10m', clusteroperator/etcd, clusteroperator/kube-apiserver]
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true
    - name: Verify documented cluster stability after recovery
      ansible.builtin.command:
        argv: ['{{ restore_oc_path }}', '--kubeconfig={{ post_api_kubeconfig }}', adm, wait-for-stable-cluster, '--minimum-stable-period=5m']
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true
    - name: Take fresh backup before enabling its source timer
      ansible.builtin.systemd_service:
        name: '{{ backup_service_name }}.service'
        state: started
      delegate_to: '{{ backup_source_hostname }}'
      run_once: true
      when: restore_fixture_action_path | length == 0
    - name: Record simulated fresh backup
      ansible.builtin.command:
        argv: ['{{ restore_fixture_action_path }}', fresh-backup, '{{ backup_source_hostname }}']
      delegate_to: '{{ backup_source_hostname }}'
      changed_when: true
      run_once: true
      when: restore_fixture_action_path | length > 0
    - name: Enable source backup timer only after health and fresh backup
      ansible.builtin.systemd_service:
        name: '{{ backup_service_name }}.timer'
        enabled: true
        state: started
      delegate_to: '{{ backup_source_hostname }}'
      run_once: true
      when: restore_fixture_action_path | length == 0
    - name: Record simulated timer enablement
      ansible.builtin.command:
        argv: ['{{ restore_fixture_action_path }}', timer-enable, '{{ backup_source_hostname }}']
      delegate_to: '{{ backup_source_hostname }}'
      changed_when: true
      run_once: true
      when: restore_fixture_action_path | length > 0
    - name: Write verified checkpoint
      ansible.builtin.copy:
        content: '{"phase":"VERIFIED","set_id":"{{ restore_selection }}","next_safe_action":"monitor the re-enabled source timer and retain checkpoint evidence"}'
        dest: '{{ restore_controller_state_dir }}/{{ restore_selection }}.json'
        mode: '0600'
      delegate_to: localhost
      become: false
      run_once: true
