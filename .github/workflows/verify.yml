name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip ansible-core ansible-lint
      - run: python -m unittest discover -s tests -v
      - run: bash -n roles/etcd_backup/files/ocp-etcd-backup-runner
      - run: ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/backup-install.yml
      - run: ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/list-backups.yml
      - run: ansible-playbook --syntax-check -i inventory/hosts.yml playbooks/restore.yml
      - run: ansible-lint --offline
